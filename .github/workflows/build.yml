name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Compile
        run: javac -d bin src/edu/poli/modulo/GenerateInfoFiles.java
      - name: Generate data
        run: java -cp bin edu.poli.modulo.GenerateInfoFiles
      - name: Check output is reproducible
        run: git diff --exit-code -- data/
